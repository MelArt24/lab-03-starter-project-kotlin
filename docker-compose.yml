version: '3.8'

services:
  db:
    image: postgres:15
    container_name: notes_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: notesdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: notes_app
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/notesdb
      DB_USER: user
      DB_PASSWORD: password
    stdin_open: true
    tty: true

volumes:
  pgdata:
